name: Recolectar posiciones

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm install

      - name: Recolectar posiciones
        env:
          BA_TRANSPORTE_CLIENT_ID: ${{ secrets.BA_TRANSPORTE_CLIENT_ID }}
          BA_TRANSPORTE_CLIENT_SECRET: ${{ secrets.BA_TRANSPORTE_CLIENT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run collect
